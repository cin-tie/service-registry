server.port=${PORT:8080}

# --- PostgreSQL ---
# Локально: docker compose up -d (значения по умолчанию подходят).
# На хостинге задаются переменными окружения DB_URL / DB_USER / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/registry}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Пул соединений
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# --- Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Ключ для служебного удаления сервиса (заголовок X-Admin-Key). На хостинге сменить!
registry.admin-key=${ADMIN_KEY:dev-admin-key}

springdoc.swagger-ui.path=/swagger
